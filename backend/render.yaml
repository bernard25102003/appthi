services:
  - type: web
    name: fastfood-backend
    runtime: docker
    region: singapore
    plan: standard
    
    # Docker configuration
    dockerfilePath: ./Dockerfile
    dockerCommand: "node dist/index.js"
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
        
    # Database migration hook - runs before deploying
    preRelease:
      - type: exec
        command: "npx prisma migrate deploy"
    
    # Auto-deploy on push to main/master
    autoDeployOnPush: true
    
    # Optimization settings
    buildFilter:
      paths:
        - "backend/src/**"
        - "backend/prisma/**"
        - "backend/package.json"
        - "backend/package-lock.json"
        - "backend/tsconfig*.json"
        - "backend/Dockerfile"
        - "frontend/src/**"
        - "frontend/package.json"
        - "frontend/package-lock.json"
        - "frontend/index.html"
        - "frontend/vite.config.ts"
        - "frontend/tsconfig.json"
        - "frontend/postcss.config.mjs"

# IMPORTANT: Add these environment variables in Render Dashboard:
# Core Configuration:
# - NODE_ENV: production
# - PORT: 4000
#
# Database:
# - DATABASE_URL: Connection pool URL from Supabase/Render PostgreSQL
# - DIRECT_URL: Direct connection URL for migrations (required)
#
# Frontend Integration:
# - CLIENT_URL: Frontend URL for CORS (e.g., https://appthi.vercel.app)
# - API_URL: Backend URL for email links (e.g., https://appthi.onrender.com)
#
# Security:
# - JWT_ACCESS_SECRET: Minimum 32 random characters
# - JWT_REFRESH_SECRET: Minimum 32 random characters
#
# Image Upload:
# - IMAGEKIT_PUBLIC_KEY
# - IMAGEKIT_PRIVATE_KEY
# - IMAGEKIT_URL_ENDPOINT
#
# Email Service (Brevo):
# - BREVO_API_KEY
# - BREVO_SENDER_NAME
# - BREVO_SENDER_EMAIL
#
# Rate Limiting (Optional):
# - RATE_LIMIT_WINDOW_MS: Default 900000 (15 minutes)
# - RATE_LIMIT_MAX: Default 100
# - AUTH_RATE_LIMIT_MAX: Default 5
