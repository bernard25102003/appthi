services:
  - type: web
    name: ecommerce-backend
    env: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node --no-warnings dist/main.js
    healthCheckPath: /health
    healthCheckInterval: 10
    maxShutdownDelaySeconds: 30
    preDeployCommand: npx prisma migrate deploy --skip-generate 2>&1 || true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://food.mio.io.vn,https://admin.food.mio.io.vn
      - key: RATE_LIMIT_MAX
        value: 500
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: LOG_LEVEL
        value: info
